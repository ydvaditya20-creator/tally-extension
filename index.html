<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally ERP 9 Web Controller</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #008080; } /* Tally ERP 9 Teal Color theme */
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #008080; color: white; border: none; padding: 10px 15px; margin-top: 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #006666; }
        button.secondary { background: #4caf50; }
        textarea { width: 100%; height: 180px; margin-top: 10px; font-family: monospace; background: #222; color: #fff; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Tally ERP 9 Web Connector 🚀</h1>

    <!-- 1. DATA PUSH TO TALLY ERP 9 -->
    <div class="card">
        <h2>1. Tally ERP 9 में सेल्स एंट्री डालें</h2>
        <label>पार्टी का नाम (Ledger Name):</label>
        <input type="text" id="partyName" value="Cash">

        <label>राशि (Amount):</label>
        <input type="number" id="amount" value="2500">

        <button id="btnPush">Tally ERP 9 में पुश करें</button>
    </div>

    <!-- 2. DATA PULL FROM TALLY ERP 9 -->
    <div class="card">
        <h2>2. Tally ERP 9 से लेजर्स निकालें</h2>
        <p>Tally में बने हुए मास्टर लेजर्स की लिस्ट एक्सपोर्ट करें:</p>
        <button id="btnPull" class="secondary">Tally से लेजर्स फेच करें</button>
    </div>

    <!-- 3. OUTPUT / RESPONSE -->
    <div class="card">
        <h2>Tally ERP 9 Response Output</h2>
        <textarea id="output" readonly placeholder="Tally ERP 9 से आने वाला XML रिस्पॉन्स यहाँ दिखेगा..."></textarea>
    </div>

    <script>
        // --- 1. TALLY ERP 9 में डेटा पुश करने का लॉजिक ---
        document.getElementById('btnPush').addEventListener('click', () => {
            const party = document.getElementById('partyName').value;
            const amt = document.getElementById('amount').value;
            const date = new Date().toISOString().slice(0,10).replace(/-/g,""); // YYYYMMDD Format
            const randomVoucherNo = "ERP-" + Date.now().toString().slice(-4);

            // Tally ERP 9 Compatible Sales Voucher XML
            const erp9SalesXML = `<ENVELOPE>
                <HEADER>
                    <TALLYREQUEST>Import Data</TALLYREQUEST>
                </HEADER>
                <BODY>
                    <IMPORTDATA>
                        <REQUESTDESC>
                            <REPORTNAME>Vouchers</REPORTNAME>
                            <STATICVARIABLES>
                                <SVCURRENTCOMPANY>##SVCURRENTCOMPANY</SVCURRENTCOMPANY>
                            </STATICVARIABLES>
                        </REQUESTDESC>
                        <REQUESTDATA>
                            <TALLYMESSAGE xmlns:UDF="TallyUDF">
                                <VOUCHER VTYPE="Sales" ACTION="Create" OBJVIEW="Accounting Voucher View">
                                    <DATE>${date}</DATE>
                                    <EFFECTIVEDATE>${date}</EFFECTIVEDATE>
                                    <VOUCHERNUMBER>${randomVoucherNo}</VOUCHERNUMBER>
                                    <PARTYLEDGERNAME>${party}</PARTYLEDGERNAME>
                                    <PERSISTEDVIEW>Accounting Voucher View</PERSISTEDVIEW>
                                    
                                    <!-- Debit Entry (Customer / Cash) -->
                                    <ALLLEDGERENTRIES.LIST>
                                        <LEDGERNAME>${party}</LEDGERNAME>
                                        <ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE>
                                        <LEDGERFROMITEM>No</LEDGERFROMITEM>
                                        <REMOVEZEROENTRIES>No</REMOVEZEROENTRIES>
                                        <AMOUNT>-${amt}</AMOUNT>
                                    </ALLLEDGERENTRIES.LIST>
                                    
                                    <!-- Credit Entry (Sales Account) -->
                                    <ALLLEDGERENTRIES.LIST>
                                        <LEDGERNAME>Sales Accounts</LEDGERNAME>
                                        <ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE>
                                        <LEDGERFROMITEM>No</LEDGERFROMITEM>
                                        <REMOVEZEROENTRIES>No</REMOVEZEROENTRIES>
                                        <AMOUNT>${amt}</AMOUNT>
                                    </ALLLEDGERENTRIES.LIST>
                                </VOUCHER>
                            </TALLYMESSAGE>
                        </REQUESTDATA>
                    </IMPORTDATA>
                </BODY>
            </ENVELOPE>`;

            sendRequestToExtension(erp9SalesXML);
        });

        // --- 2. TALLY ERP 9 से डेटा निकालने का लॉजिक ---
        document.getElementById('btnPull').addEventListener('click', () => {
            const fetchXML = `<ENVELOPE>
                <HEADER>
                    <TALLYREQUEST>Export Data</TALLYREQUEST>
                </HEADER>
                <BODY>
                    <EXPORTDATA>
                        <REQUESTDESC>
                            <REPORTNAME>List of Ledgers</REPORTNAME>
                            <SVEXPORTFORMAT>$$SysName:XML</SVEXPORTFORMAT>
                        </REQUESTDESC>
                        <REQUESTDATA/>
                    </EXPORTDATA>
                </BODY>
            </ENVELOPE>`;

            sendRequestToExtension(fetchXML);
        });

        // एक्सटेंशन को इवेंट भेजने का कॉमन फंक्शन
        function sendRequestToExtension(xml) {
            document.getElementById('output').value = "Tally ERP 9 से कनेक्ट हो रहा है...";
            const event = new CustomEvent("SendToTallyEvent", { detail: { xml: xml } });
            window.dispatchEvent(event);
        }

        // एक्सटेंशन से आने वाले रिस्पॉन्स को सुनना
        window.addEventListener("TallyResponseEvent", function(event) {
            const response = event.detail;
            if (response.success) {
                document.getElementById('output').value = response.data;
            } else {
                document.getElementById('output').value = "Error: " + response.error + "\n\nसुनिश्चित करें कि Tally ERP 9 चालू है, उसमें कंपनी ओपन है और उसका पोर्ट F12 Advanced Configuration में 9000 पर सेट है।";
            }
        });
    </script>
</body>
</html>
